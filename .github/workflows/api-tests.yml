name: API Tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt is UTF-16 (generated by `pip freeze` in PowerShell) --
      # modern pip auto-detects this via the file's BOM, so no conversion step
      # is needed here; this mirrors exactly what Render's build does.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # graphrisk_core (the private package the real Cypher query text lives
      # in -- see app/graph/queries.py) is never installed here: tests/conftest.py
      # stubs it out, since every route only does attribute access on the
      # query constants and hands them straight to a mocked run_query/run_write.
      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing
