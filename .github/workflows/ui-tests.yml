name: UI Tests

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos: don't fail the build on info-level findings
        # (currently ~134 pre-existing deprecated_member_use / style infos
        # across the existing screens, first surfaced now that analyze runs
        # in CI at all). Real warnings and errors still fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
